name: Build installers

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-installers-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
            artifact: windows-x64
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
            artifact: linux-x64
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: macos-aarch64
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
            artifact: macos-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Python for the Windows portable bundle
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled model catalogs
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm run fetch:catalogs
            if [ -s src-tauri/models-cn.json ] && [ -s src-tauri/models-dev.json ]; then
              exit 0
            fi
            echo "Model catalogs are incomplete after attempt ${attempt}; retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "Failed to fetch the bundled model catalogs" >&2
          exit 1

      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Silicon requires a structurally valid signature. Until Flowlet
          # has a Developer ID certificate, use Tauri's documented ad-hoc
          # identity so the app is signed without claiming Apple notarization.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          # macOS assets are uploaded by the gated step below only after the
          # generated app bundle passes codesign verification.
          releaseId: ${{ github.event_name == 'release' && runner.os != 'macOS' && github.event.release.id || '' }}
          tagName: ${{ github.event_name == 'release' && runner.os != 'macOS' && github.event.release.tag_name || '' }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: Flowlet_[version]_[platform]_[arch][setup][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: flowlet-${{ matrix.artifact }}-[bundle]
          uploadUpdaterJson: false

      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg_path="$(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "The macOS bundle build did not produce a DMG" >&2
            exit 1
          fi

          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" -quiet || true
            rmdir "$mount_point" || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_point" -quiet
          app_path="$mount_point/Flowlet.app"
          if [ ! -d "$app_path" ]; then
            echo "Flowlet.app was not found inside the generated DMG" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_info="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature_info"
          if ! grep -q '^Signature=adhoc$' <<<"$signature_info"; then
            echo "Expected an ad-hoc macOS signature" >&2
            exit 1
          fi

      - name: Upload verified macOS DMG to the GitHub Release
        if: runner.os == 'macOS' && github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg_path="$(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "The verified macOS build did not produce a DMG" >&2
            exit 1
          fi

          case "${{ matrix.target }}" in
            aarch64-apple-darwin) release_arch="aarch64" ;;
            x86_64-apple-darwin) release_arch="x64" ;;
            *) echo "Unsupported macOS release target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac

          version="$(node -p "require('./package.json').version")"
          release_asset="$RUNNER_TEMP/Flowlet_${version}_darwin_${release_arch}.dmg"
          cp "$dmg_path" "$release_asset"
          gh release upload "${{ github.event.release.tag_name }}" "$release_asset" --clobber

      - name: Build Windows portable ZIP
        if: runner.os == 'Windows'
        run: node scripts/build-portable.mjs

      - name: Upload Windows portable workflow artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: flowlet-windows-x64-portable
          path: src-tauri/target/release/bundle/portable/*.zip
          if-no-files-found: error

      - name: Upload Windows portable ZIP to the GitHub Release
        if: runner.os == 'Windows' && github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" src-tauri/target/release/bundle/portable/*.zip --clobber

  android:
    name: Android arm64
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.15729638"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled model catalogs
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm run fetch:catalogs
            if [ -s src-tauri/models-cn.json ] && [ -s src-tauri/models-dev.json ]; then
              exit 0
            fi
            echo "Model catalogs are incomplete after attempt ${attempt}; retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "Failed to fetch the bundled model catalogs" >&2
          exit 1

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Actions secret is missing: ${name}" >&2
              exit 1
            fi
          done

          keystore_path="$GITHUB_WORKSPACE/src-tauri/gen/android/flowlet-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$keystore_path
          EOF

      - name: Build signed Android APK
        run: npm run tauri:android:build

      - name: Verify and stage Android APK
        shell: bash
        run: |
          source_apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          version="$(node -p "require('./package.json').version")"
          output_dir="src-tauri/target/release/bundle/android"
          output_apk="$output_dir/Flowlet_${version}_arm64.apk"

          test -f "$source_apk"
          mkdir -p "$output_dir"
          cp "$source_apk" "$output_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$output_apk"

      - name: Upload Android APK workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: flowlet-android-arm64-apk
          path: src-tauri/target/release/bundle/android/*.apk
          if-no-files-found: error

      - name: Upload Android APK to the GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" src-tauri/target/release/bundle/android/*.apk --clobber

      - name: Upload Android APK to Pgyer
        if: github.event_name == 'release'
        shell: bash
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail

          if [ -z "$PGYER_API_KEY" ]; then
            echo "Required GitHub Actions secret is missing: PGYER_API_KEY" >&2
            exit 1
          fi

          apk_path="$(find src-tauri/target/release/bundle/android -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$apk_path" ] || [ ! -f "$apk_path" ]; then
            echo "Android APK was not found for Pgyer upload" >&2
            exit 1
          fi

          token_response="$(curl --fail-with-body --silent --show-error \
            --request POST 'https://www.pgyer.com/apiv2/app/getCOSToken' \
            --data-urlencode "_api_key=$PGYER_API_KEY" \
            --data-urlencode 'buildType=apk' \
            --data-urlencode 'buildInstallType=1' \
            --data-urlencode 'buildInstallDate=2' \
            --data-urlencode "buildUpdateDescription=$RELEASE_NOTES")"

          token_code="$(jq -r '.code // -1' <<<"$token_response")"
          if [ "$token_code" != "0" ]; then
            token_message="$(jq -r '.message // "Unknown Pgyer token error"' <<<"$token_response")"
            echo "Pgyer rejected the upload request: $token_message (code $token_code)" >&2
            exit 1
          fi

          endpoint="$(jq -r '.data.endpoint // empty' <<<"$token_response")"
          build_key="$(jq -r '.data.key // empty' <<<"$token_response")"
          signature="$(jq -r '.data.params.signature // empty' <<<"$token_response")"
          security_token="$(jq -r '.data.params["x-cos-security-token"] // empty' <<<"$token_response")"
          upload_key="$(jq -r '.data.params.key // empty' <<<"$token_response")"

          if [ -z "$endpoint" ] || [ -z "$build_key" ] || [ -z "$signature" ] || [ -z "$security_token" ] || [ -z "$upload_key" ]; then
            echo "Pgyer returned an incomplete upload token" >&2
            exit 1
          fi

          upload_status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --form-string "key=$upload_key" \
            --form-string "signature=$signature" \
            --form-string "x-cos-security-token=$security_token" \
            --form-string "x-cos-meta-file-name=$(basename "$apk_path")" \
            --form "file=@$apk_path" \
            "$endpoint")"

          if [ "$upload_status" != "204" ]; then
            echo "Pgyer file upload failed with HTTP status $upload_status" >&2
            exit 1
          fi

          for attempt in $(seq 1 40); do
            build_response="$(curl --fail-with-body --silent --show-error \
              --get 'https://www.pgyer.com/apiv2/app/buildInfo' \
              --data-urlencode "_api_key=$PGYER_API_KEY" \
              --data-urlencode "buildKey=$build_key")"
            build_code="$(jq -r '.code // -1' <<<"$build_response")"

            if [ "$build_code" = "0" ]; then
              shortcut="$(jq -r '.data.buildShortcutUrl // empty' <<<"$build_response")"
              version="$(jq -r '.data.buildVersion // empty' <<<"$build_response")"
              echo "Pgyer published Flowlet ${version}: https://www.pgyer.com/${shortcut}"
              exit 0
            fi

            if [ "$build_code" != "1247" ]; then
              build_message="$(jq -r '.message // "Unknown Pgyer publishing error"' <<<"$build_response")"
              echo "Pgyer publishing failed: $build_message (code $build_code)" >&2
              exit 1
            fi

            echo "Pgyer is processing the APK (${attempt}/40)..."
            sleep 5
          done

          echo "Timed out waiting for Pgyer to publish the APK" >&2
          exit 1
