name: Build installers

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-installers-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            artifact: windows-x64
          - name: Linux x64
            platform: ubuntu-22.04
            artifact: linux-x64
          - name: macOS Apple Silicon
            platform: macos-latest
            artifact: macos-arm64
          - name: macOS Intel
            platform: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # ACP stdio execution uses the official Go A2A bridge on every platform.
      - name: Set up Go for the ACP bridge
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: packages/flowlet-agent-bridge/go.sum

      - name: Set up Python for portable ZIPs
        if: runner.os != 'macOS'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Check command registration and types
        run: |
          npm run node:commands
          npm run check
          npm run node:typecheck
          npm run desktop:typecheck

      - name: Fetch bundled model catalogs
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run fetch:catalogs && [ -s resources/catalogs/models-cn.json ] && [ -s resources/catalogs/models-dev.json ]; then
              exit 0
            fi
            echo "Model catalogs are incomplete after attempt ${attempt}; retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "Failed to fetch the bundled model catalogs" >&2
          exit 1

      - name: Build Electron installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:dist

      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(packages/flowlet-desktop/release/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS DMG" >&2
            exit 1
          fi
          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" -quiet || true
            rmdir "$mount_point" || true
          }
          trap cleanup EXIT
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -mountpoint "$mount_point" -quiet
          app_path="$mount_point/Flowlet.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_info="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature_info"
          if [[ "$signature_info" != *"Signature=adhoc"* ]]; then
            echo "Expected an ad-hoc macOS signature" >&2
            exit 1
          fi

      - name: Build Electron portable ZIP
        if: runner.os != 'macOS'
        run: node scripts/build-desktop-portable.mjs --no-build

      - name: Upload installers and portable ZIPs
        uses: actions/upload-artifact@v7
        with:
          name: flowlet-${{ matrix.artifact }}
          path: |
            packages/flowlet-desktop/release/*.exe
            packages/flowlet-desktop/release/*.zip
            packages/flowlet-desktop/release/*.AppImage
            packages/flowlet-desktop/release/*.deb
            packages/flowlet-desktop/release/*.dmg
            packages/flowlet-desktop/release/portable/*.zip
          if-no-files-found: error

      - name: Upload verified assets to the GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          assets=(packages/flowlet-desktop/release/*.exe packages/flowlet-desktop/release/*.zip packages/flowlet-desktop/release/*.AppImage packages/flowlet-desktop/release/*.deb packages/flowlet-desktop/release/*.dmg packages/flowlet-desktop/release/portable/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were produced" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
