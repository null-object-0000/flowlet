# Official Electron desktop build/release; Android stays in build-installers.yml.
name: Desktop (Electron) build & smoke

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*-beta*"

permissions:
  contents: write

concurrency:
  group: desktop-electron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x64 (build + xvfb smoke)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch shared model catalogs
        run: npm run fetch:catalogs
      - name: Typecheck (core + desktop host + frontend)
        run: |
          npm run node:typecheck
          npm run check
          npm run desktop:typecheck
      - name: Node tests (core + desktop commands)
        run: node --test "packages/flowlet-core/src/**/*.test.ts"
      - name: Desktop command contract coverage
        run: node scripts/desktop-command-parity.mjs --check
      - name: Build desktop frontend + host bundle
        run: |
          npm run build:desktop
          npm run desktop:build
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Smoke (single window + health)
        run: npm run desktop:smoke
      - name: Smoke (all routes + screenshots)
        run: npm run desktop:smoke:pages
      - name: Package (AppImage + deb)
        run: npm run desktop:dist
      - name: Upload desktop assets to Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(packages/flowlet-desktop/release/*.AppImage packages/flowlet-desktop/release/*.deb packages/flowlet-desktop/release/*.exe packages/flowlet-desktop/release/*.zip packages/flowlet-desktop/release/*.dmg packages/flowlet-desktop/release/portable/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No desktop assets were produced" >&2
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${assets[@]}" --clobber
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowlet-desktop-linux-x64
          path: |
            packages/flowlet-desktop/release/*.AppImage
            packages/flowlet-desktop/release/*.deb
            .flowlet-dev-data/desktop-smoke/*.png
            .flowlet-dev-data/desktop-pages/*.png
            .flowlet-dev-data/desktop-pages/report.json
          if-no-files-found: error

  windows:
    name: Windows x64 (build only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch shared model catalogs
        run: npm run fetch:catalogs
      - name: Typecheck + tests
        run: |
          npm run node:typecheck
          npm run desktop:typecheck
          node --test "packages/flowlet-core/src/**/*.test.ts"
      - name: Build desktop frontend + host bundle
        run: |
          npm run build:desktop
          npm run desktop:build
      - name: Package (nsis + zip)
        run: npm run desktop:dist
      - name: Build Windows portable ZIP
        run: node scripts/build-desktop-portable.mjs --no-build
      - name: Upload desktop assets to Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(packages/flowlet-desktop/release/*.AppImage packages/flowlet-desktop/release/*.deb packages/flowlet-desktop/release/*.exe packages/flowlet-desktop/release/*.zip packages/flowlet-desktop/release/*.dmg packages/flowlet-desktop/release/portable/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No desktop assets were produced" >&2
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${assets[@]}" --clobber
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowlet-desktop-windows-x64
          path: |
            packages/flowlet-desktop/release/*.exe
            packages/flowlet-desktop/release/*.zip
            packages/flowlet-desktop/release/portable/*.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (build only)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch shared model catalogs
        run: npm run fetch:catalogs
      - name: Typecheck + tests
        run: |
          npm run node:typecheck
          npm run desktop:typecheck
          node --test "packages/flowlet-core/src/**/*.test.ts"
      - name: Build desktop frontend + host bundle
        run: |
          npm run build:desktop
          npm run desktop:build
      - name: Package (dmg, ad-hoc)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:dist -- -- --${{ matrix.arch }}
      - name: Verify macOS ad-hoc signature
        shell: bash
        run: |
          shopt -s nullglob
          apps=(packages/flowlet-desktop/release/mac*/Flowlet.app)
          if [ ${#apps[@]} -eq 0 ]; then exit 1; fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=4 "$app" 2>&1 | grep -q "^Signature=adhoc$"
          done
      - name: Upload desktop assets to Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(packages/flowlet-desktop/release/*.AppImage packages/flowlet-desktop/release/*.deb packages/flowlet-desktop/release/*.exe packages/flowlet-desktop/release/*.zip packages/flowlet-desktop/release/*.dmg packages/flowlet-desktop/release/portable/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No desktop assets were produced" >&2
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${assets[@]}" --clobber
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowlet-desktop-macos-${{ matrix.arch }}
          path: packages/flowlet-desktop/release/*.dmg
          if-no-files-found: error
