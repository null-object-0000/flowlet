# Electron 桌面端构建、Node 契约检查与冒烟；正式发布由 build-installers.yml 负责。
name: Desktop (Electron) build & smoke

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-beta*"

permissions:
  contents: read

concurrency:
  group: desktop-electron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x64 (build + xvfb smoke)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Set up Go for the ACP bridge
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: packages/flowlet-agent-bridge/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Build ACP bridge for Node tests
        run: npm run agent-bridge:build
      - name: Typecheck (core + desktop host + frontend)
        run: |
          npm run node:typecheck
          npm run check
          npm run desktop:typecheck
      - name: Node tests (core + desktop commands)
        run: node --test packages/flowlet-core/src
      - name: Node command-name contract (registration only)
        run: npm run node:commands
      - name: Fetch bundled model catalogs
        run: npm run fetch:catalogs
      - name: Build desktop frontend + host bundle
        run: |
          npm run build:desktop
          npm run desktop:build
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Smoke (single window + health)
        run: npm run desktop:smoke
      - name: Smoke (all routes + screenshots)
        run: npm run desktop:smoke:pages
      - name: Package (AppImage + deb)
        run: npm run desktop:dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowlet-desktop-linux-x64
          path: |
            packages/flowlet-desktop/release/*.AppImage
            packages/flowlet-desktop/release/*.deb
            .flowlet-dev-data/desktop-smoke/*.png
            .flowlet-dev-data/desktop-pages/*.png
            .flowlet-dev-data/desktop-pages/report.json
          if-no-files-found: error

  windows:
    name: Windows x64 (build only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Set up Go for the ACP bridge
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: packages/flowlet-agent-bridge/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Build ACP bridge for Node tests
        run: npm run agent-bridge:build
      - name: Typecheck + tests
        run: |
          npm run node:typecheck
          npm run desktop:typecheck
          node --test packages/flowlet-core/src
      - name: Fetch bundled model catalogs
        run: npm run fetch:catalogs
      - name: Build desktop frontend + host bundle
        run: |
          npm run build:desktop
          npm run desktop:build
      - name: Package (nsis + portable zip)
        run: npm run desktop:dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowlet-desktop-windows-x64
          path: |
            packages/flowlet-desktop/release/*.exe
            packages/flowlet-desktop/release/*.zip
          if-no-files-found: error

  macos:
    name: macOS (build only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Set up Go for the ACP bridge
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: packages/flowlet-agent-bridge/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Build ACP bridge for Node tests
        run: npm run agent-bridge:build
      - name: Typecheck + tests
        run: |
          npm run node:typecheck
          npm run desktop:typecheck
          node --test packages/flowlet-core/src
      - name: Fetch bundled model catalogs
        run: npm run fetch:catalogs
      - name: Build desktop frontend + host bundle
        run: |
          npm run build:desktop
          npm run desktop:build
      - name: Package (dmg, ad-hoc)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowlet-desktop-macos
          path: packages/flowlet-desktop/release/*.dmg
          if-no-files-found: error
