services:
  flowlet:
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org}
    image: flowlet:local
    restart: unless-stopped
    ports:
      - "${FLOWLET_WEB_PORT:-20134}:8080"
      - "${FLOWLET_PROXY_PORT:-20135}:18640"
    environment:
      FLOWLET_ADMIN_AUTH_MODE: ${FLOWLET_ADMIN_AUTH_MODE:-token}
      FLOWLET_ADMIN_TOKEN: ${FLOWLET_ADMIN_TOKEN:-}
      FLOWLET_ADMIN_ALLOW_TOKEN_LOGIN: ${FLOWLET_ADMIN_ALLOW_TOKEN_LOGIN:-0}
      FLOWLET_PUBLIC_WEB_URL: ${FLOWLET_PUBLIC_WEB_URL:-}
      FLOWLET_OIDC_ISSUER: ${FLOWLET_OIDC_ISSUER:-}
      FLOWLET_OIDC_DISCOVERY_URL: ${FLOWLET_OIDC_DISCOVERY_URL:-}
      FLOWLET_OIDC_ALLOW_HTTP_ISSUER: ${FLOWLET_OIDC_ALLOW_HTTP_ISSUER:-0}
      FLOWLET_OIDC_CLIENT_ID: ${FLOWLET_OIDC_CLIENT_ID:-}
      FLOWLET_OIDC_CLIENT_SECRET: ${FLOWLET_OIDC_CLIENT_SECRET:-}
      FLOWLET_OIDC_SCOPES: ${FLOWLET_OIDC_SCOPES:-openid}
      FLOWLET_OIDC_DISPLAY_NAME: ${FLOWLET_OIDC_DISPLAY_NAME:-GitLab}
      FLOWLET_OIDC_ALLOWED_SUBS: ${FLOWLET_OIDC_ALLOWED_SUBS:-}
      FLOWLET_OIDC_ALLOWED_GROUPS: ${FLOWLET_OIDC_ALLOWED_GROUPS:-}
      FLOWLET_OIDC_PKCE: ${FLOWLET_OIDC_PKCE:-auto}
      FLOWLET_OIDC_NONCE: ${FLOWLET_OIDC_NONCE:-required}
      FLOWLET_OIDC_SIGNING_ALGS: ${FLOWLET_OIDC_SIGNING_ALGS:-RS256}
      FLOWLET_ADMIN_SESSION_IDLE_MINUTES: ${FLOWLET_ADMIN_SESSION_IDLE_MINUTES:-30}
      FLOWLET_ADMIN_SESSION_TTL_HOURS: ${FLOWLET_ADMIN_SESSION_TTL_HOURS:-8}
      FLOWLET_CLIENT_TOKEN: ${FLOWLET_CLIENT_TOKEN:-}
      FLOWLET_PUBLIC_PROXY_URL: ${FLOWLET_PUBLIC_PROXY_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - flowlet-data:/data
    stop_grace_period: 30s
volumes:
  flowlet-data:
