services:
  flowlet:
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org}
    image: flowlet:local
    restart: unless-stopped
    ports:
      - "${FLOWLET_WEB_PORT:-20134}:8080"
      - "${FLOWLET_PROXY_PORT:-20135}:18640"
    environment:
      FLOWLET_ADMIN_TOKEN: ${FLOWLET_ADMIN_TOKEN:?请在 .env 中设置至少 24 字符的管理凭据}
      FLOWLET_CLIENT_TOKEN: ${FLOWLET_CLIENT_TOKEN:-}
      FLOWLET_PUBLIC_PROXY_URL: ${FLOWLET_PUBLIC_PROXY_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - flowlet-data:/data
    stop_grace_period: 30s
volumes:
  flowlet-data:
