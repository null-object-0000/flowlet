[package]
name = "flowlet"
version = "0.2.0"
description = "Flowlet Android device synchronization viewer"
authors = ["Flowlet"]
edition = "2021"
autobins = false

[features]
default = ["mobile"]
mobile = ["dep:tauri", "dep:tauri-build"]

[lib]
name = "flowlet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
keyring = "4.1.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusty-s3 = "0.10.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", default-features = false, features = ["wry"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "time", "io-util"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
keyring = { version = "4.1.5", features = ["android-native-keyring-store"] }
keyring-core = "1.0.0"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
