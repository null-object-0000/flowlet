<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/flowlet-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowlet — 多个 AI Agent 共用一个本地模型入口</title>
    <meta
      name="description"
      content="Flowlet 是面向 AI Agent 的开源桌面客户端：统一接入模型渠道，把 Agent 会话、实际请求、路由结果、Token 与费用关联起来。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flowlet" />
    <meta property="og:title" content="Flowlet — 多个 AI Agent 共用一个本地模型入口" />
    <meta
      property="og:description"
      content="一次接入，统一切换；请求失败知道原因，Token 和费用知道花在哪。"
    />
    <meta property="og:url" content="https://flowlet.snewbie.site/" />
    <meta property="og:image" content="https://flowlet.snewbie.site/flowlet-logo.png" />
    <script>
      // 在样式加载前恢复显式选择；没有显式选择时跟随系统，避免首屏主题闪烁。
      try {
        const storedTheme = localStorage.getItem("flowlet-website-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (storedTheme === "dark" || (storedTheme !== "light" && prefersDark)) {
          document.documentElement.setAttribute("theme-mode", "dark");
        }
      } catch {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.setAttribute("theme-mode", "dark");
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
