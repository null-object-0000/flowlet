<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/flowlet-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowlet — 多个 AI Agent 共用一个模型入口</title>
    <meta
      name="description"
      content="Flowlet 是面向 AI Agent 的开源模型服务控制台。集中管理账号、追查实际路由、查看 Token 和预估费用；支持桌面版与自托管 Web / Docker。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flowlet" />
    <meta property="og:title" content="Flowlet — 多个 AI Agent 共用一个模型入口" />
    <meta
      property="og:description"
      content="集中管理模型账号，追查实际路由、上游错误和用量。支持桌面版与自托管 Web / Docker。"
    />
    <meta property="og:url" content="https://flowlet.snewbie.site/" />
    <meta property="og:image" content="https://flowlet.snewbie.site/flowlet-logo.png" />
    <script>
      // 在样式加载前恢复显式选择；没有显式选择时跟随系统，避免首屏主题闪烁。
      try {
        const storedTheme = localStorage.getItem("flowlet-website-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (storedTheme === "dark" || (storedTheme !== "light" && prefersDark)) {
          document.documentElement.setAttribute("theme-mode", "dark");
        }
      } catch {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.setAttribute("theme-mode", "dark");
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
